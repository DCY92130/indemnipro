# Blueprint Render — service Python natif (plan gratuit, sans Docker).
# Pour une mise en prod RGPD, préférez un hébergeur UE (Scaleway/OVH) — voir DEPLOYMENT.md.
services:
  - type: web
    name: proindemni-backend
    runtime: python
    plan: free             # 0.1 CPU / 512 Mo — sans plan, Render prend un plan payant par défaut
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m spacy download fr_core_news_md
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false            # saisie à la main dans le dashboard Render (secret)
      - key: SPACY_MODEL
        value: fr_core_news_md # modèle léger (~45 Mo) pour l'hébergement
      - key: CORS_ORIGINS
        value: "*"
